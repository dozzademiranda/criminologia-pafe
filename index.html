/* P.A.F.E. — refinamento visual v2; somente CSS, sem alterações no conteúdo e na lógica. */
:root {
  --bg:#0b1222;
  --panel:#152238;
  --panel2:#1c2d47;
  --text:#edf4fd;
  --muted:#b9cada;
  --line:#344a66;
  --accent:#64dfca;
  --accent2:#b0f3e3;
  --warning:#ffd38c;
  --danger:#ffa0ad;
  --good:#85e0b5;
  --info:#a1bfff;
  --violet:#c4b7ff;
  --btn-ink:#062b2e;
  --shadow:0 10px 30px rgba(1,9,25,.24);
}
:root[data-theme="light"] {
  --bg:#edf3f8;
  --panel:#ffffff;
  --panel2:#eff5fa;
  --text:#18283e;
  --muted:#4a6078;
  --line:#cbd8e5;
  --accent:#0b8179;
  --accent2:#046a62;
  --warning:#90600e;
  --danger:#ae354b;
  --good:#166d4a;
  --info:#305e9e;
  --violet:#6750a5;
  --btn-ink:#ffffff;
  --shadow:0 8px 27px rgba(26,62,96,.08);
}
html { scroll-padding-top:104px; }
body {
  line-height:1.68;
  background:
    radial-gradient(ellipse 70% 38% at 84% -9%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 75%),
    radial-gradient(ellipse 64% 55% at -10% 25%,color-mix(in srgb,var(--violet) 5%,transparent),transparent 70%),
    var(--bg);
  letter-spacing:.004em;
}
button, input, select { line-height:1.4; }
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible,a:focus-visible,summary:focus-visible {
  outline:3px solid var(--warning);
  outline-offset:3px;
}
a {text-decoration-thickness:1px;text-underline-offset:3px;}
header {
  background:color-mix(in srgb,var(--bg) 94%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--line) 85%,var(--accent));
  box-shadow:0 6px 24px rgba(2,8,20,.13);
}
.head {padding:12px clamp(16px,2.7vw,36px);gap:16px;}
.brand {position:relative;padding-left:15px;}
.brand::before {content:"";width:4px;position:absolute;left:0;top:1px;bottom:0;border-radius:20px;background:linear-gradient(var(--accent),var(--info));}
.brand strong {font-size:1.05rem;letter-spacing:.07em;font-weight:850;}
.brand small {font-size:.75rem;letter-spacing:.008em;line-height:1.4;color:var(--muted);}
.header-actions {gap:8px;}
.btn {
  background:color-mix(in srgb,var(--panel) 88%,var(--panel2));
  border:1px solid var(--line);
  border-radius:11px;
  padding:.61rem .9rem;
  font-weight:690;
  box-shadow:0 1px 0 color-mix(in srgb,var(--text) 4%,transparent);
  transition:background .15s, border-color .15s, box-shadow .15s, transform .15s;
}
.btn:hover:not(:disabled) {background:color-mix(in srgb,var(--panel2) 82%,var(--accent) 18%);border-color:var(--accent);transform:translateY(-1px);}
.btn:active:not(:disabled) {transform:translateY(0);}
.btn-primary {
  color:var(--btn-ink);
  border-color:transparent;
  background:linear-gradient(125deg,var(--accent),color-mix(in srgb,var(--accent) 78%,var(--info)));
  box-shadow:0 4px 15px color-mix(in srgb,var(--accent) 17%,transparent);
}
.btn-primary:hover:not(:disabled) {
  color:var(--btn-ink);
  border-color:transparent;
  background:linear-gradient(125deg,color-mix(in srgb,var(--accent) 85%,white),color-mix(in srgb,var(--accent) 65%,var(--info)));
}
.btn-danger {border-color:color-mix(in srgb,var(--danger) 34%,var(--line));}
.btn.selected {border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel));}
.layout {
  max-width:1390px;
  grid-template-columns:240px minmax(0,1fr);
  gap:26px;
  padding:26px clamp(16px,2.7vw,36px) 64px;
}
.sidebar {
  top:91px;
  max-height:calc(100vh - 109px);
  padding:15px 11px;
  border-radius:18px;
  background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 89%,var(--bg)));
  box-shadow:var(--shadow);
}
.sidebar h2 {margin:5px 12px 15px;letter-spacing:.12em;font-size:.71rem;}
.side-nav {gap:5px;}
.side-nav button {border-radius:11px;padding:12px 12px;font-size:.91rem;min-height:44px;}
.side-nav button:hover {background:color-mix(in srgb,var(--panel2) 86%,var(--accent) 14%);}
.side-nav button[aria-current="page"] {
  background:linear-gradient(105deg,color-mix(in srgb,var(--accent) 16%,var(--panel)),color-mix(in srgb,var(--info) 10%,var(--panel)));
  border-color:color-mix(in srgb,var(--accent) 68%,var(--line));
  box-shadow:inset 3px 0 0 var(--accent);
  color:var(--text);
  font-weight:720;
}
.side-nav .number {color:var(--accent2);font-size:.86rem;width:23px;}
.sidebar .divider {margin:16px 2px;}
.sidebar .small-note {font-size:.78rem;line-height:1.55;margin:10px 5px;}
.main {max-width:1030px;}
main h1 {font-size:clamp(1.83rem,3.1vw,2.65rem);line-height:1.16;letter-spacing:-.032em;font-weight:790;}
main h2 {font-size:clamp(1.16rem,1.7vw,1.38rem);letter-spacing:-.017em;line-height:1.35;font-weight:760;}
main h3 {font-size:1.07rem;line-height:1.43;}
main p {max-width:79ch;}
p {margin:.4rem 0 1rem;}
.lead {font-size:1rem;line-height:1.65;max-width:78ch;}
.eyebrow {color:var(--accent2);font-size:.71rem;font-weight:850;letter-spacing:.14em;line-height:1.5;}
.panel,.intro-card {border-radius:19px;}
.panel {
  background:var(--panel);
  padding:clamp(19px,2.5vw,28px);
  border:1px solid var(--line);
  margin-bottom:17px;
  box-shadow:var(--shadow);
}
.panel.soft {
  background:linear-gradient(118deg,color-mix(in srgb,var(--accent) 5%,var(--panel)),color-mix(in srgb,var(--info) 7%,var(--panel)));
  border-color:color-mix(in srgb,var(--line) 83%,var(--accent));
}
.panel > h2 {padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px;}
.intro-card {
  position:relative;
  overflow:hidden;
  padding:clamp(25px,3.2vw,38px);
  background:
    radial-gradient(ellipse 62% 100% at 105% 4%,color-mix(in srgb,var(--accent) 21%,transparent),transparent 76%),
    radial-gradient(ellipse 45% 90% at 17% 115%,color-mix(in srgb,var(--violet) 15%,transparent),transparent 80%),
    linear-gradient(130deg,var(--panel),color-mix(in srgb,var(--panel) 82%,var(--panel2)));
  border:1px solid color-mix(in srgb,var(--line) 66%,var(--accent));
  box-shadow:var(--shadow);
  margin-bottom:17px;
}
.intro-card::after {content:"";position:absolute;right:-75px;top:-90px;width:280px;height:280px;border:1px solid color-mix(in srgb,var(--accent) 23%,transparent);border-radius:50%;pointer-events:none;}
.intro-card .eyebrow {display:inline-block;max-width:100%;padding:5px 10px;border-radius:99px;background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 29%,transparent);}
.intro-card h1 {font-size:clamp(1.88rem,3.2vw,2.7rem);margin:17px 0 12px;max-width:24ch;}
.intro-card .lead {color:var(--muted);}
.badge-row {gap:9px;row-gap:8px;margin-top:19px;}
.pill {padding:4px 11px;font-size:.74rem;font-weight:760;letter-spacing:.02em;}
